<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Banner LinkedIn</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B1B3D;--lime:#A6F31D;--pink:#FF3DA5;--cyan:#6EDDE8;--lilac:#B39BE8;--yellow:#FAF49A}
*{box-sizing:border-box;margin:0}
body{width:1584px;height:396px;overflow:hidden;position:relative;font-family:"Fredoka",sans-serif;color:var(--ink);
 background-color:#FFC9EC;background-image:linear-gradient(rgba(255,255,255,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.55) 2px,transparent 2px);background-size:36px 36px}
*{animation:none!important;transition:none!important}
svg{display:block}
.eyeblink{opacity:0}
.cloud{position:absolute}
.cloud svg{width:100%;height:auto}
.t{font-family:"Fredoka",sans-serif;font-weight:700;color:var(--lime);-webkit-text-stroke:11px var(--ink);paint-order:stroke fill;text-shadow:5px 6px 0 var(--ink);line-height:.95;letter-spacing:.01em}
.hi{position:absolute;left:470px;top:20px;display:inline-block;background:var(--pink);color:#fff;border:4px solid var(--ink);border-radius:12px;padding:2px 18px;font-family:"Pixelify Sans",monospace;font-weight:600;font-size:26px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg)}
h1{position:absolute;left:468px;top:66px;font-size:90px;white-space:nowrap}
.sub{position:absolute;left:470px;top:262px;background:#fff;border:4px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:6px 20px;font-family:"Pixelify Sans",monospace;font-weight:700;font-size:27px;white-space:nowrap}
.chips{position:absolute;left:470px;top:334px;display:flex;gap:12px}
.chips span{border:3px solid var(--ink);border-radius:10px;padding:0 14px;font-family:"Pixelify Sans",monospace;font-weight:700;font-size:22px;box-shadow:3px 3px 0 var(--ink)}
.chips span:nth-child(1){background:var(--lime)}.chips span:nth-child(2){background:var(--cyan)}.chips span:nth-child(3){background:var(--yellow)}.chips span:nth-child(4){background:#FFA6D8}
.win{position:absolute;left:1140px;top:30px;width:410px;background:#fff;border:4px solid var(--ink);border-radius:14px;box-shadow:7px 7px 0 var(--ink);overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:4px 12px;background:var(--cyan);border-bottom:4px solid var(--ink);font-family:"Pixelify Sans",monospace;font-weight:600;font-size:17px}
.bar span{margin-right:auto}
.bar i{font-style:normal;font-size:12px;width:18px;height:18px;border:2px solid var(--ink);border-radius:4px;display:grid;place-items:center;background:#fff}
#scene{background:linear-gradient(#FFE3F5,#FFD0EE)}
#scene svg{width:100%;height:auto}
</style></head><body>
<div id="clouds"></div>
<span class="hi">oi! eu sou a</span>
<h1 class="t">KASE<br>WULHYNEK</h1>
<div class="sub">Técnica em TI | Desenvolvimento Web</div>
<div class="chips"><span>Laravel</span><span>PHP</span><span>JavaScript</span><span>Python</span></div>
<div class="win"><div class="bar"><span>gg_bem_jogado.exe</span><i>–</i><i>□</i><i>✕</i></div><div id="scene"></div></div>
<script>
/* ---------- renderizador de pixel art ---------- */
const SPR={
  cloud:{pal:{X:'#FFFFFF',c:'#CFE7FF'},rows:[
    "........XXXXXX",
    "......XXXXXXXXXX",
    "..XXXXXXXXXXXXXXXXXX",
    ".XXXXXXXXXXXXXXXXXXXXX",
    "XXXXXXXXXXXXXXXXXXXXXXX",
    "cccccccccccccccccccccc"]},
  mount:{pal:{X:'#2F6BFF',D:'#1B3FA8',W:'#FFFFFF'},rows:[
    "....W....","...WWW...","..WXWXW..","..XXXXXD.",".XXXXXXDD","XXXXXXXXD","XXXXXXXXX","DDDDDDDDD"]},
  cal:{pal:{X:'#FF3DA5',W:'#FFFFFF',D:'#B39BE8',K:'#2B1B3D'},rows:[
    ".K.....K.","XXXXXXXXX","XXXXXXXXX","WWWWWWWWW","WDWDWDWDW","WWWWWWWWW","WDWDWKWDW","WWWWWWWWW","WDWDWDWDW"]},
  sun:{pal:{O:'#FFB000',R:'#FFD23F'},rows:[
    "....R....","R...R...R","..OOOOO..",".OOOOOOO.","ROOOOOOOR",".OOOOOOO.","..OOOOO..","R...R...R","....R...."]},
  star:{pal:{X:'#FFFFFF',Y:'#FFD23F'},rows:[
    "...X...","...X...","..XXX..","XXXXXXX","..XXX..","...X...","...X..."]},
  heart:{pal:{X:'#FF3DA5'},rows:[".XX.XX.","XXXXXXX","XXXXXXX",".XXXXX.","..XXX..","...X..."]},
  cat:{pal:{X:'#FFFFFF',O:'#2B1B3D',P:'#FF9EC4'},rows:["X...X","XXXXX","XOXOX","XXPXX",".XXX."]},
  cursor:{pal:{X:'#2B1B3D',W:'#FFFFFF'},rows:[
    "X.........","XX........","XWX.......","XWWX......","XWWWX.....","XWWWWX....","XWWWWWX...","XWWWWWWX..","XWWWXXXXX.","XWXWX.....","XX.XWX....","X..XWX....","....XWX...","....XX...."]},
  girl:{pal:{R:'#D81E4F',r:'#9C1139',S:'#FFDCCB',E:'#2B1B3D',P:'#FF9EC4',M:'#E0457A',T:'#B39BE8',H:'#6EDDE8',G:'#FFFFFF',W:'#B8B8D8',B:'#FF3DA5'},rows:[
    ".....rRRRRRRr.....",
    "....RRRRRRRRRR....",
    "...RRRRRRRRRRRR...",
    "..RRRRRRRRRRRRRR..",
    "..RRRRRRRRRRRRRR..",
    "..RRSSSSSSSSSSRR..",
    ".HRRSSSSSSSSSSRRH.",
    ".HHRSEESSSSEESRHH.",
    ".HHRSEESSSSEESRHH.",
    ".HHRSPSSSSSSPSRHH.",
    ".HHRSSSSMMSSSSRHH.",
    "..RRRSSSSSSSSRRR..",
    "..RRR.SSSSSS.RRR..",
    "..RRTTTTTTTTTTRR..",
    ".RRRTTTTTTTTTTRRR.",
    ".RRTTTTTTTTTTTTRR.",
    ".RRTTSSGGGGSSTTRR.",
    ".RRTTGGWGGBGGTTRR.",
    ".RR.TTTTTTTTTT.RR.",
    "..R.TTTTTTTTTT.R.."]}
};
function draw(name,px,extra=''){
  const {rows,pal}=SPR[name], w=Math.max(...rows.map(r=>r.length)); let o='';
  rows.forEach((r,y)=>{let x=0;while(x<w){const c=r[x]||'.';if(c==='.'){x++;continue}let e=x+1;while(e<w&&(r[e]||'.')===c)e++;
    o+=`<rect x="${x*px}" y="${y*px}" width="${(e-x)*px}" height="${px}" fill="${pal[c]}"/>`;x=e}});
  return {svg:o+extra,w:w*px,h:rows.length*px};
}
document.querySelectorAll('.sprite[data-s]').forEach(el=>{
  const d=draw(el.dataset.s,+el.dataset.px);
  el.innerHTML=`<svg viewBox="0 0 ${d.w} ${d.h}" shape-rendering="crispEdges" aria-hidden="true">${d.svg}</svg>`;
});


const sprites=[['cloud',6,40,40,150],['cloud',6,230,205,120],['cloud',6,1010,300,110],['cloud',6,330,20,90]];
document.getElementById('clouds').innerHTML=sprites.map(([n,px,x,y,w])=>{const d=draw(n,px);return `<div class="cloud" style="left:${x}px;top:${y}px;width:${w}px"><svg viewBox="0 0 ${d.w} ${d.h}" shape-rendering="crispEdges">${d.svg}</svg></div>`}).join('')
 +[[420,170,2],[1080,20,2],[200,120,2],[110,330,3],[1060,170,3]].map(([x,y,p])=>{const d=draw('star',p*2);return `<div class="cloud" style="left:${x}px;top:${y}px;width:${d.w}px"><svg viewBox="0 0 ${d.w} ${d.h}" shape-rendering="crispEdges">${d.svg}</svg></div>`}).join('');
/* ---------- cena do hero ---------- */
(function(){
  const px=9, g=draw('girl',px);
  const blink=[[5,7],[6,7],[11,7],[12,7]].map(([c,r])=>`<rect x="${c*px}" y="${r*px}" width="${px}" height="${px}" fill="#FFDCCB"/>`).join('');
  const btn=`<rect class="btnblink" x="${10*px}" y="${17*px}" width="${px}" height="${px}" fill="#FFD23F"/>`;
  const heart=(x,y,cls,delay)=>`<g class="${cls}" style="animation-delay:${delay}s" transform="translate(${x} ${y})">${draw('heart',3).svg}</g>`;
  const star=(x,y,d)=>`<g transform="translate(${x} ${y})"><g class="tw" style="animation-delay:${d}s">${draw('star',3).svg}</g></g>`;
  const game=`
    <svg x="221" y="76" width="138" height="108" viewBox="0 0 46 36" shape-rendering="crispEdges">
      <rect width="46" height="36" fill="#3A2A6E"/>
      <rect x="6" y="9" width="1" height="1" fill="#fff"/><rect x="38" y="14" width="1" height="1" fill="#fff"/><rect x="24" y="6" width="1" height="1" fill="#FFD23F"/><rect x="14" y="20" width="1" height="1" fill="#6EDDE8"/>
      <text class="score" x="2" y="5" font-family="Pixelify Sans,monospace" font-size="4" fill="#A6F31D">SCORE 0420</text>
      <g class="hf" style="animation-delay:0s" transform="translate(6 6)">${draw('heart',1).svg}</g>
      <g class="hf" style="animation-delay:-1s" transform="translate(21 4)">${draw('heart',1).svg}</g>
      <g class="hf" style="animation-delay:-1.9s" transform="translate(35 8)">${draw('heart',1).svg}</g>
      <rect x="0" y="33" width="46" height="3" fill="#A6F31D"/>
      <g class="cat" transform="translate(0 28)"><g>${draw('cat',1).svg}</g></g>
      <polygon points="0,0 20,0 0,26" fill="#fff" opacity=".09"/>
    </svg>`;
  const ups=[[110,70,0],[135,80,1.1],[90,86,2.1]].map(([x,y,d])=>`<g class="up" style="animation-delay:${d}s" transform="translate(${x} ${y})">${draw('heart',2).svg}</g>`).join('');
  document.getElementById('scene').innerHTML=`
  <svg viewBox="0 0 400 300" shape-rendering="crispEdges" style="width:100%;height:auto">
    ${star(12,24,0)}${star(188,20,.6)}${star(372,30,1.2)}${star(180,248,.9)}
    <g class="girl" transform="translate(14 56)">${g.svg}${`<g class="eyeblink">${blink}</g>`}${btn}</g>
    ${ups}
    <g class="bubble" transform="translate(150 22)">
      <rect x="0" y="0" width="52" height="30" fill="#fff" stroke="#2B1B3D" stroke-width="3"/>
      <polygon points="8,30 8,42 22,30" fill="#fff" stroke="#2B1B3D" stroke-width="3"/><rect x="5" y="28" width="20" height="5" fill="#fff"/>
      <text x="26" y="22" text-anchor="middle" font-family="Pixelify Sans,monospace" font-weight="700" font-size="18" fill="#FF3DA5">GG!</text>
    </g>
    <rect x="262" y="198" width="54" height="30" fill="#CFCBE8" stroke="#2B1B3D" stroke-width="4"/>
    <rect x="205" y="60" width="170" height="140" fill="#F4F1FF" stroke="#2B1B3D" stroke-width="4"/>
    <rect x="217" y="72" width="146" height="116" fill="#2B1B3D"/>
    ${game}
    <circle cx="352" cy="194" r="3" fill="#FF3DA5"/><circle cx="342" cy="194" r="3" fill="#A6F31D"/>
    <rect x="0" y="228" width="400" height="18" fill="#FF3DA5" stroke="#2B1B3D" stroke-width="4"/>
    <rect x="0" y="246" width="400" height="54" fill="#B39BE8" stroke="#2B1B3D" stroke-width="4"/>
    <rect x="330" y="214" width="40" height="14" fill="#6EDDE8" stroke="#2B1B3D" stroke-width="3"/>
  </svg>`;
})();


</script></body></html>
